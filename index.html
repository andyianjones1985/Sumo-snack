<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sumo Snack</title>
<style>
:root{--bg:#f6f4ee;--fg:#222;--line:#d9d4c4;--btn:#e9e4d3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1a;--fg:#eee;--line:#3a3a34;--btn:#35352f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1c1a;--fg:#eee;--line:#3a3a34;--btn:#35352f;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;text-align:center}
body{padding:12px}
h1{font-size:1.2rem;margin:4px 0}
#hud{display:flex;justify-content:space-between;max-width:340px;margin:0 auto 8px;font-size:.8rem}
canvas{width:100%;max-width:340px;aspect-ratio:1;border:2px solid var(--line);border-radius:12px;touch-action:none}
#st{position:relative;max-width:340px;margin:0 auto}
canvas{box-sizing:border-box;display:block;margin:0 auto}#o{position:absolute;left:0;top:0;border-color:transparent;pointer-events:none}
#shopb,#upb,#cvb{margin-left:4px;border:0;border-radius:16px;padding:6px 14px;background:#f5b942;color:#222;font-size:.9rem;margin-bottom:8px}
#shop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9}#shop[hidden]{display:none}
#shop .card{background:var(--bg);color:var(--fg);border-radius:14px;padding:14px;width:min(92vw,360px);max-height:86vh;overflow:auto}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.it .e{font-size:1.8rem}.it b{flex:1;text-align:left}.it button{border:0;border-radius:12px;padding:6px 12px;background:var(--btn);color:var(--fg)}.it button.pri{background:#e0443e;color:#fff}.it button:disabled{opacity:.4}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;margin-top:10px}
.pad button{height:52px;font-size:1.4rem;border:0;border-radius:10px;background:var(--btn);color:var(--fg)}
html{overflow-x:hidden}
@keyframes shk{0%{transform:translate(0,0)}5%{transform:translate(-18px,10px)}10%{transform:translate(16px,-12px)}15%{transform:translate(-14px,-10px)}20%{transform:translate(14px,12px)}25%{transform:translate(-11px,8px)}30%{transform:translate(10px,-9px)}40%{transform:translate(-7px,6px)}50%{transform:translate(6px,-5px)}60%{transform:translate(-4px,4px)}70%{transform:translate(3px,-3px)}85%{transform:translate(-2px,2px)}100%{transform:translate(0,0)}}
body.shk{animation:shk 2.5s linear}
#fb{display:flex;gap:2px;justify-content:center;align-items:center;margin:0 auto 8px}#fb i{width:20px;height:12px;border-radius:3px;background:var(--btn);border:1px solid var(--line)}#fb i.on{background:#f5a623;border-color:#f5a623}#fb i.hot{background:#e0443e;border-color:#e0443e}
#hy{display:flex;gap:4px;justify-content:center;align-items:center;margin:0 auto 8px}#hy i{width:34px;height:12px;border-radius:4px;background:var(--btn);border:1px solid var(--line)}#hy i.on{background:#3b9be8;border-color:#3b9be8}
#lv{display:flex;gap:6px;justify-content:center;margin:6px 0 10px}#lv button{border:0;border-radius:16px;padding:6px 14px;background:var(--btn);color:var(--fg);font-size:.9rem}#lv button.on{background:#e0443e;color:#fff}
</style></head><body>
